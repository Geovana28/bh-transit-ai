name: CI/CD Pipeline - BH Transit AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint with Flake8
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,.pytest_cache
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.git,__pycache__,.pytest_cache

      - name: 🔬 Type Check with Mypy
        run: |
          mypy src/ --ignore-missing-imports || true

      - name: 🧪 Run Automated Tests (Pytest)
        run: |
          python -m pytest tests/ -v --junitxml=test-results.xml

      - name: 🐳 Build Docker Image
        if: matrix.python-version == '3.11'
        run: |
          docker build -t bh-transit-ai:latest .
